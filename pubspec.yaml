name: mixlists_project
description: "Visualize and explore personal mix playlists"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: 2.4.3
  sqflite_common_ffi: ^2.4.2
  path_provider: ^2.1.6
  path: ^1.9.1
  get_it: ^9.2.1
  cached_network_image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/database/mixlists.db
